[system]
compatible=raspberrypi4
bootloader=custom
statusfile=per-slot
bundle-formats=-plain
mountprefix=/mnt/rauc
max-bundle-download-size=2147483648
variant-name=HWID

[keyring]
path=/etc/rauc/futech-cert.pem

[handlers]
system-info=/usr/lib/rauc/info-provider.sh
pre-install=/usr/lib/rauc/pre-install.sh
post-install=/usr/lib/rauc/post-install.sh
bootloader-custom-backend=/usr/lib/rauc/backend.sh

[slot.rootfs.0]
device=/dev/mmcblk0p2
type=ext4
bootname=system0

[slot.rootfs.1]
device=/dev/mmcblk0p3
type=ext4
bootname=system1

[slot.boot.0]
parent=rootfs.0
device=/dev/mmcblk0p7
type=ext4

[slot.boot.1]
parent=rootfs.1
device=/dev/mmcblk0p8
type=ext4

